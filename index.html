
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #333333;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 35px;
            margin-bottom: 45px;
        }

        .logo {
            width: 165px;
            height: 165px;
            min-width: 165px;
            border-radius: 50%;
            background: #8e44ad;
            border: 5px solid #f4c542;
            outline: 2px solid #e9c66b;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            font-size: 28px;
            line-height: 1.2;
            font-weight: bold;
        }

        .header-content h1 {
            font-size: 42px;
            margin: 0 0 12px;
            color: #222222;
        }

        .header-content p {
            font-size: 19px;
            line-height: 1.6;
            color: #777777;
            margin: 0;
        }

        /* Form layout */
        .form-section {
            margin-bottom: 35px;
            padding-bottom: 35px;
            border-bottom: 1px solid #eeeeee;
        }

        .form-section:last-of-type {
            border-bottom: none;
        }

        .section-title {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .grid-three {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 35px;
        }

        .grid-two {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 35px;
        }

        .field {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 18px;
            margin-bottom: 12px;
            color: #444444;
        }

        .required {
            color: #e53955;
        }

        input, select {
            width: 100%;
            height: 55px;
            padding: 0 18px;
            border: 1px solid #d9dce1;
            border-radius: 6px;
            font-size: 17px;
            color: #333333;
            background-color: #ffffff;
            outline: none;
        }

        input::placeholder {
            color: #9299a1;
        }

        input:focus, select:focus {
            border-color: #168cf0;
            box-shadow: 0 0 0 3px rgba(22, 140, 240, 0.10);
        }

        .address-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0 35px;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            height: 55px;
            background: #168cf0;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #0874d1;
        }

        #message {
            display: none;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            background: #e8f8ee;
            color: #18733a;
            border-radius: 6px;
            font-size: 16px;
        }

        /* Mobile responsive */
        @media (max-width: 700px) {
            body {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 22px;
                margin-bottom: 35px;
            }

            .logo {
                width: 110px;
                height: 110px;
                min-width: 110px;
                font-size: 20px;
            }

            .header-content h1 {
                font-size: 29px;
            }

            .header-content p {
                font-size: 16px;
            }

            .grid-three,
            .grid-two,
            .address-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .field {
                margin-bottom: 22px;
            }

            label {
                font-size: 16px;
            }

            input, select {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Company Header -->
    <div class="header">

        <div class="logo">
            7<br>Brains<br>
        </div>

        <div class="header-content">
            <h1>Employee Registration Form</h1>
            <p>
                Please fill out the form for the HR department to
                complete your registration. An HR manager will
                contact you with further instructions.
            </p>
        </div>

    </div>

    <form id="employeeForm">

        <!-- Full Name -->
        <div class="form-section">

            <div class="section-title">Full Name</div>

            <div class="grid-three">

                <div class="field">
                    <input type="text" id="firstName"
                           placeholder="First Name" required>
                </div>

                <div class="field">
                    <input type="text" id="middleName"
                           placeholder="Middle Name">
                </div>

                <div class="field">
                    <input type="text" id="lastName"
                           placeholder="Last Name" required>
                </div>

            </div>

            <div class="grid-two">

                <div class="field">
                    <label for="maritalStatus">Marital Status</label>
                    <select id="maritalStatus">
                        <option value="">Select status</option>
                        <option>Single</option>
                        <option>Married</option>
                        <option>Divorced</option>
                        <option>Widowed</option>
                    </select>
                </div>

                <div class="field">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>

            </div>

        </div>

        <!-- Contact Information -->
        <div class="form-section">

            <div class="grid-two">

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email"
                           placeholder="E-mail">
                </div>

                <div class="field">
                    <label for="mobile">
                        Mobile Number <span class="required">*</span>
                    </label>
                    <input type="tel" id="mobile"
                           placeholder="Enter mobile number"
                           pattern="[0-9]{10}"
                           maxlength="10" required>
                </div>

            </div>

        </div>

        <!-- Home Address -->
        <div class="form-section">

            <div class="section-title">Home Address</div>

            <div class="field">
                <input type="text" id="street"
                       placeholder="Street Address" required>
            </div>

            <div class="address-grid">

                <div class="field">
                    <input type="text" id="city"
                           placeholder="City" required>
                </div>

                <div class="field">
                    <input type="text" id="state"
                           placeholder="State / Province" required>
                </div>

                <div class="field">
                    <input type="text" id="country"
                           placeholder="Country" required>
                </div>

                <div class="field">
                    <input type="text" id="zip"
                           placeholder="ZIP Code" required>
                </div>

            </div>

        </div>

        <button type="submit" class="submit-btn">
            REGISTER ME
        </button>

        <div id="message" role="status"></div>

    </form>

</div>

<script>
    const form = document.getElementById("employeeForm");
    const message = document.getElementById("message");

    const scriptURL = "https://script.google.com/macros/s/AKfycbz1AsxzBL4mW5hWdB-_vMLct8WqZBRj9c3t1dW8vtpX2sLgl9YdW1VaCklQBBhoKXG14g/exec";

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const data = {
            firstName: document.getElementById("firstName").value,
            middleName: document.getElementById("middleName").value,
            lastName: document.getElementById("lastName").value,
            maritalStatus: document.getElementById("maritalStatus").value,
            dob: document.getElementById("dob").value,
            email: document.getElementById("email").value,
            mobile: document.getElementById("mobile").value,
            street: document.getElementById("street").value,
            city: document.getElementById("city").value,
            state: document.getElementById("state").value,
            country: document.getElementById("country").value,
            zip: document.getElementById("zip").value
        };

        fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        })
        .then(function() {
            message.textContent =
                "Registration submitted! Please check with HR to confirm.";
            message.style.display = "block";
            form.reset();
        })
        .catch(function(error) {
            message.textContent =
                "Submission error. Please try again.";
            message.style.display = "block";
            console.error(error);
        });
    });
</script>
</body>
</html>
